// ==================== REDUCER ====================
const initialState = { chapterStatus:{}, practiceHistory:[], mistakes:[], planCompleted:{}, quizAnswers:{} };

function appReducer(state, action) {
  switch(action.type) {
    case 'SET_CHAPTER_STATUS': return{...state,chapterStatus:{...state.chapterStatus,[action.chapterId]:action.status}};
    case 'ADD_PRACTICE': return{...state,practiceHistory:[...state.practiceHistory,action.practice]};
    case 'ADD_MISTAKE': if(state.mistakes.find(m=>m.id===action.mistake.id&&m.date===action.mistake.date))return state; return{...state,mistakes:[...state.mistakes,action.mistake]};
    case 'REMOVE_MISTAKE': return{...state,mistakes:state.mistakes.filter(m=>m.id!==action.id)};
    case 'TOGGLE_PLAN_DAY': return{...state,planCompleted:{...state.planCompleted,[action.day]:!state.planCompleted[action.day]}};
    case 'SET_QUIZ_ANSWER': return{...state,quizAnswers:{...state.quizAnswers,[action.questionId]:action.answer}};
    case 'RESET_QUIZ': const na={...state.quizAnswers}; action.questionIds.forEach(id=>delete na[id]); return{...state,quizAnswers:na};
    default: return state;
  }
}

      <div className="flex gap-2">
        <div className="flex-1 bg-slate-800 rounded-xl p-2.5 text-center border border-slate-700/50"><div className="text-lg font-bold text-white">{exams.length}</div><div className="text-[10px] text-slate-400">Tổng đề</div></div>
        <div className="flex-1 bg-slate-800 rounded-xl p-2.5 text-center border border-slate-700/50"><div className="text-lg font-bold text-amber-400">{thCount}</div><div className="text-[10px] text-slate-400">Thanh Hoá</div></div>
        <div className="flex-1 bg-slate-800 rounded-xl p-2.5 text-center border border-slate-700/50"><div className="text-lg font-bold text-emerald-400">{checkedCount}</div><div className="text-[10px] text-slate-400">Đã làm</div></div>
      </div>

      {/* Type filter */}
      <div className="flex gap-1.5 overflow-x-auto pb-1">{[{k:'all',l:'Tất cả'},{k:'Trường',l:'🏫 Trường TH'},{k:'Sở',l:'🏛 Sở GD'},{k:'Bộ',l:'⭐ Bộ GD'},{k:'Tổng hợp',l:'📦 Tổng hợp'}].map(f=>(<button key={f.k} onClick={()=>setExamTypeFilter(f.k)} className={`px-2.5 py-1.5 rounded-lg text-xs whitespace-nowrap ${examTypeFilter===f.k?'bg-blue-600 text-white':'bg-slate-800 text-slate-400'}`}>{f.l}</button>))}</div>

      {/* Exam list */}
      <div className="space-y-2">{filtered.map(ex=>{
        const isTH=ex.source.includes('Thanh')||ex.id.startsWith('TH-');
        const done=examChecked[ex.id];
        return(<div key={ex.id} className={`bg-slate-800/80 rounded-xl p-3 border ${isTH?'border-amber-800/40':'border-slate-700/50'}`}>
          <div className="flex items-start gap-3">
            <button onClick={()=>setExamChecked(p=>({...p,[ex.id]:!p[ex.id]}))} className={`w-5 h-5 rounded-md flex items-center justify-center text-xs flex-shrink-0 mt-0.5 ${done?'bg-emerald-600 text-white':'bg-slate-700 text-slate-500'}`}>{done?'✓':''}</button>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-1.5 mb-1">
                {isTH&&<span className="text-[9px] px-1.5 py-0.5 bg-amber-900/50 text-amber-300 rounded-full">Thanh Hoá</span>}
                <span className="text-[9px] px-1.5 py-0.5 bg-slate-700 text-slate-300 rounded-full">{ex.type}</span>
                <span className="text-[9px] text-slate-500">{ex.year}</span>
              </div>
              <a href={ex.url} target="_blank" rel="noopener noreferrer" className="text-sm text-blue-300 hover:text-blue-200 leading-snug block">{ex.name} ↗</a>
              <p className="text-[11px] text-slate-500 mt-1">{ex.note}</p>
            </div>
          </div>
        </div>);})}</div>

      {/* Aggregate sources */}
      <div className="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/50 mt-4">
        <h3 className="text-sm font-semibold text-white mb-3">🔗 Nguồn đề thi tổng hợp</h3>
        <div className="space-y-2">{EXAM_AGGREGATE_SOURCES.map((s,i)=>(<a key={i} href={s.url} target="_blank" rel="noopener noreferrer" className="block bg-slate-900/60 rounded-lg p-2.5"><p className="text-sm text-blue-300 font-medium">{s.name} ↗</p><p className="text-[11px] text-slate-500">{s.desc}</p></a>))}</div>
      </div>
    </div>);
  };

  // ==================== RENDER: MISTAKES ====================
  const renderMistakes=()=>{
    const f=mistakeFilter==='all'?state.mistakes:state.mistakes.filter(m=>m.subject===mistakeFilter);
    return(<div className="space-y-4 pb-4">
      <h2 className="text-lg font-bold text-white">📝 Sổ tay sai lầm</h2>
      <div className="flex gap-2 flex-wrap">{[{key:'all',label:'Tất cả'},...Object.entries(SUBJECTS).map(([k,s])=>({key:k,label:s.emoji+' '+s.name}))].map(fi=>(<button key={fi.key} onClick={()=>setMistakeFilter(fi.key)} className={`px-3 py-1.5 rounded-lg text-xs ${mistakeFilter===fi.key?'bg-blue-600 text-white':'bg-slate-800 text-slate-400'}`}>{fi.label}</button>))}</div>
      {f.length===0?<div className="text-center py-12 text-slate-500"><p className="text-4xl mb-2">🎉</p><p className="text-sm">Chưa có lỗi sai. Bắt đầu luyện đề!</p></div>:
      <div className="space-y-3">{[...f].reverse().map((m,i)=>(<div key={`${m.id}-${i}`} className="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/50">
        <div className="flex items-center gap-2 mb-2"><span className="text-xs">{SUBJECTS[m.subject]?.emoji}</span><span className="text-[10px] text-slate-500">{m.date}</span><span className="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-900/40 text-amber-400">{m.level}</span></div>
        <p className="text-sm text-white mb-2">{m.question}</p>
        <div className="text-xs space-y-1 mb-2"><p className="text-red-400">Đã chọn: {['A','B','C','D'][m.selectedAns]}. {m.options[m.selectedAns]}</p><p className="text-emerald-400">Đáp án: {['A','B','C','D'][m.correctAns]}. {m.options[m.correctAns]}</p></div>
        <div className="bg-slate-900/60 rounded-lg p-2.5 text-xs text-slate-300">{m.explain}</div>
        <button onClick={()=>{dispatch({type:'REMOVE_MISTAKE',id:m.id});if(QUESTION_BANK[m.chapterId]){setActiveTab('practice');setSelectedChapter(m.chapterId);setQuizSubmitted(false);}}} className="mt-2 text-xs text-blue-400 underline">Làm lại →</button>
      </div>))}</div>}
    </div>);
  };

  // ==================== RENDER: TIPS ====================
  const renderTips=()=>(<div className="space-y-4 pb-4">
    <h2 className="text-lg font-bold text-white">💡 Mẹo thi</h2>
    <div className="flex gap-2 overflow-x-auto pb-1">{[{k:'time',l:'⏱ Thời gian'},{k:'eliminate',l:'🎯 Loại trừ'},{k:'cheat',l:'📋 Công thức'},{k:'mental',l:'🧠 Tâm lý'}].map(t=>(<button key={t.k} onClick={()=>setTipsSection(t.k)} className={`px-3 py-1.5 rounded-lg text-xs whitespace-nowrap ${tipsSection===t.k?'bg-blue-600 text-white':'bg-slate-800 text-slate-400'}`}>{t.l}</button>))}</div>
    {tipsSection==='time'&&<div className="space-y-2">{EXAM_TIPS.timeManagement.map((t,i)=>(<div key={i} className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/50"><p className="text-sm text-slate-300">{t}</p></div>))}</div>}
    {tipsSection==='eliminate'&&<div className="space-y-2">{EXAM_TIPS.eliminationStrategy.map((t,i)=>(<div key={i} className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/50"><p className="text-sm text-slate-300">{t}</p></div>))}</div>}
    {tipsSection==='cheat'&&<div className="space-y-4">{Object.entries(EXAM_TIPS.cheatSheets).map(([k,fs])=>(<div key={k} className="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/50"><h3 className="text-sm font-semibold text-white mb-3">{SUBJECTS[k].emoji} {SUBJECTS[k].name}</h3><div className="space-y-2">{fs.map((f,i)=>(<div key={i} className="bg-slate-900/60 rounded-lg p-2.5"><p className="text-xs text-slate-300 font-mono">{f}</p></div>))}</div></div>))}</div>}
    {tipsSection==='mental'&&<div className="space-y-2">{EXAM_TIPS.mentalTips.map((t,i)=>(<div key={i} className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/50"><p className="text-sm text-slate-300">{t}</p></div>))}</div>}
  </div>);

  // ==================== RENDER: MORE ====================
  const renderMore=()=>(<div className="space-y-4 pb-4">
    <div className="flex gap-1.5">{[{k:'mistakes',l:'📝 Sai lầm'},{k:'tips',l:'💡 Mẹo thi'},{k:'exams',l:'📄 Đề thi'}].map(t=>(<button key={t.k} onClick={()=>setMoreTab(t.k)} className={`flex-1 py-2.5 rounded-xl text-sm font-medium ${moreTab===t.k?'bg-blue-600 text-white':'bg-slate-800 text-slate-400'}`}>{t.l}</button>))}</div>
    {moreTab==='mistakes'&&renderMistakes()}
    {moreTab==='tips'&&renderTips()}
    {moreTab==='exams'&&renderExamLibrary()}
  </div>);

  // ==================== MAIN RENDER ====================
  const tabs=[{id:'home',label:'Trang chủ',icon:'🏠'},{id:'knowledge',label:'Kiến thức',icon:'📚'},{id:'practice',label:'Luyện đề',icon:'🎯'},{id:'planner',label:'Kế hoạch',icon:'📅'},{id:'more',label:'Thêm',icon:'⋯'}];
  const renderContent=()=>{switch(activeTab){case 'home':return renderDashboard();case 'knowledge':return renderKnowledge();case 'practice':return renderPractice();case 'planner':return renderPlanner();case 'more':return renderMore();default:return renderDashboard();}};

  return(<div className="min-h-screen bg-slate-950 text-white font-sans">
    <div className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md border-b border-slate-800/50 px-4 py-3"><div className="max-w-lg mx-auto flex items-center justify-between"><div className="flex items-center gap-2"><span className="text-xl">🏛️</span><h1 className="text-lg font-bold bg-gradient-to-r from-blue-400 to-violet-400 bg-clip-text text-transparent">Archimedes</h1></div><div className="flex items-center gap-1.5 bg-slate-800/60 px-2.5 py-1 rounded-full"><span className="text-[10px] text-slate-400">🎯</span><span className="text-xs font-bold text-blue-400">{totalProgress}%</span></div></div></div>
    <div className="max-w-lg mx-auto px-4 pt-4 pb-24" key={fadeKey} style={{animation:'fadeIn 0.25s ease-out'}}>{renderContent()}</div>
    <div className="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur-md border-t border-slate-800/50"><div className="max-w-lg mx-auto flex">{tabs.map(tab=>(<button key={tab.id} onClick={()=>handleTabChange(tab.id)} className={`flex-1 flex flex-col items-center py-2.5 transition-colors ${activeTab===tab.id?'text-blue-400':'text-slate-500'}`}><span className="text-lg mb-0.5">{tab.icon}</span><span className="text-[10px]">{tab.label}</span></button>))}</div></div>
    <style>{`@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}`}</style>
  </div>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(Archimedes));
</script>
</body>
</html>
